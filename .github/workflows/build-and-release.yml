name: 🛠️ Build and release images
on:
  workflow_dispatch:
    inputs:
      versions:
        # Make sure that the latest version stays on the right so that it is built last
        # This will ensure that the latest versions appear on top in GitHub and DockerHub.
        description: 'JSON array of versions (latest on far right)'
        default: '[ "23.XX.X", "23.YY.Y" ]'
        required: true
        type: string
      latest_version:
        description: 'Version for latest tag ("23.XX.Y")'
        type: string

jobs:

  set-constants:
    name: 🔠 Setting workflow constants
    runs-on: ubuntu-24.04
    outputs:
      FLAVORS: '[ "f", "r", "s" ]'
      RPM_ARCH: '[ "aarch64", "x86_64" ]'
      IMAGE_ARCH: '[ "amd64", "arm64" ]'
    steps:
      - run: echo "setting constants"

  download-install-files:
    name: ⬇️ Download install binaries
    environment: build
    runs-on: ubuntu-24.04
    needs: set-constants
    strategy:
      matrix:
        versions: ${{ fromJSON(inputs.versions) }}
        arch: ${{ fromJSON(needs.set-constants.outputs.RPM_ARCH) }}
    steps:
      - name: 🔍 Determine RPM file name
        run: |
          # Retrieve the version being built
          VERSION="${{ matrix.versions }}"
          if [[ "${VERSION}" == "23.2" || "${VERSION}" == "23.3" ]]; then
            DATABASE_NAME="oracle-database-free-23c"
          elif [[ "${#VERSION}" == 4 ]]; then
            DATABASE_NAME="oracle-database-free-23ai"
          else
            DATABASE_NAME="oracle-ai-database-free-26ai"
          fi;
          echo "DATABASE_NAME=${DATABASE_NAME}" >> "$GITHUB_ENV"

      - name: ⬇️ Download install file from web
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ secrets.FILE_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null
          eval $(ssh-agent)
          ssh-add - <<< "${{ secrets.FILE_USER_AUTH }}"
          scp ${{ secrets.FILE_USER }}@${{ secrets.FILE_SERVER }}:"${{ env.DATABASE_NAME }}-${{ matrix.versions }}-1.el8.${{ matrix.arch }}.rpm" .

      - name: 💾 Store install file
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: ${{ env.DATABASE_NAME }}-${{ matrix.versions }}-1.el8.${{ matrix.arch }}.rpm
          path: ${{ env.DATABASE_NAME }}-${{ matrix.versions }}-1.el8.${{ matrix.arch }}.rpm

  build-and-test-images:
    name: 🛠️ 🔬 Build and test images
    runs-on: ${{ matrix.os }}
    environment: build
    needs: [ set-constants, download-install-files ]
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        versions: ${{ fromJSON(inputs.versions) }}
        flavors: ${{ fromJSON(needs.set-constants.outputs.FLAVORS) }}
    steps:
      - name: 🧹 Cleanup runner
        run: |
          # Remove Java (JDKs)
          sudo rm -rf /usr/lib/jvm

          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet

          # Remove Swift toolchain
          sudo rm -rf /usr/share/swift

          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup

          # Remove Julia
          sudo rm -rf /usr/local/julia*

          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium

          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google

          # Remove Azure CLI
          sudo rm -rf /opt/az

      - name: 📂 Checkout repo
        uses: actions/checkout@v7

      - name: 🔄 Generate environment variables
        id: env_vars
        run: |
          if     [ "${{ matrix.flavors }}" == "f" ]; then image_flavor="-full";
            elif [ "${{ matrix.flavors }}" == "r" ]; then image_flavor="";
            elif [ "${{ matrix.flavors }}" == "s" ]; then image_flavor="-slim";
            else image_flavor="";
          fi;
          echo "IMAGE_FLAVOR=$image_flavor" >> "$GITHUB_OUTPUT"
          os_arch=$(uname -m)
          if     [ "${os_arch}" == "aarch64" ]; then image_arch="arm64";
            elif [ "${os_arch}" == "x86_64" ];  then image_arch="amd64";
            else image_arch="";
          fi;
          echo "IMAGE_ARCH=$image_arch" >> "$GITHUB_OUTPUT"
          echo "OS_ARCH=$os_arch" >> "$GITHUB_OUTPUT"

          # Retrieve the version being built
          VERSION="${{ matrix.versions }}"
          if [ "${#VERSION}" == 4 ]; then
            DATABASE_NAME="oracle-database-free-23ai"
          else
            DATABASE_NAME="oracle-ai-database-free-26ai"
          fi;
          echo "DATABASE_NAME=${DATABASE_NAME}" >> "$GITHUB_ENV"

      - name: ⬇️ Download stored install file
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DATABASE_NAME }}-${{ matrix.versions }}-1.el8.${{ steps.env_vars.outputs.OS_ARCH }}.rpm

      - name: 🛠️ Build container image for ${{ matrix.versions }}, flavor "${{ matrix.flavors }}"
        run: ./buildContainerImage.sh -v "${{ matrix.versions }}" -${{ matrix.flavors }}

      - name: 🧹 Cleanup build rpm
        run: rm ${{ env.DATABASE_NAME }}-${{ matrix.versions }}-1.el8.${{ steps.env_vars.outputs.OS_ARCH }}.rpm

      - name: 🛠️ Build faststart container image for ${{ matrix.versions }}, flavor "${{ matrix.flavors }}"
        run: ./buildContainerImage.sh -i -v "${{ matrix.versions }}" -${{ matrix.flavors }} -x

      - name: 🔬 Test images
        env:
          IMAGE_FLAVOR: ${{ steps.env_vars.outputs.IMAGE_FLAVOR }}
          IMAGE_ARCH: ${{ steps.env_vars.outputs.IMAGE_ARCH }}
        run: |
          cd tests
          ./test-container.sh "gvenzl/oracle-free:${{ matrix.versions }}${IMAGE_FLAVOR}-${IMAGE_ARCH}"
          ./test-container.sh "gvenzl/oracle-free:${{ matrix.versions }}${IMAGE_FLAVOR}-faststart-${IMAGE_ARCH}"

      - name: 📤 Export images to local file system
        env:
          IMAGE_FLAVOR: ${{ steps.env_vars.outputs.IMAGE_FLAVOR }}
          IMAGE_ARCH: ${{ steps.env_vars.outputs.IMAGE_ARCH }}
        run: |
          podman save -o "oracle-free-${{ matrix.versions }}${IMAGE_FLAVOR}-${IMAGE_ARCH}.tar" "localhost/gvenzl/oracle-free:${{ matrix.versions }}${IMAGE_FLAVOR}-${IMAGE_ARCH}"
          gzip "oracle-free-${{ matrix.versions }}${IMAGE_FLAVOR}-${IMAGE_ARCH}.tar"
          podman save -o "oracle-free-${{ matrix.versions }}${IMAGE_FLAVOR}-faststart-${IMAGE_ARCH}.tar" "localhost/gvenzl/oracle-free:${{ matrix.versions }}${IMAGE_FLAVOR}-faststart-${IMAGE_ARCH}"
          gzip "oracle-free-${{ matrix.versions }}${IMAGE_FLAVOR}-faststart-${IMAGE_ARCH}.tar"

      - name: ⬆️ Upload image non-faststart image for deploy job
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: oracle-free-${{ matrix.versions }}${{ steps.env_vars.outputs.IMAGE_FLAVOR }}-${{ steps.env_vars.outputs.IMAGE_ARCH }}
          path: oracle-free-${{ matrix.versions }}${{ steps.env_vars.outputs.IMAGE_FLAVOR }}-${{ steps.env_vars.outputs.IMAGE_ARCH }}.tar.gz

      - name: ⬆️ Upload image faststart image for deploy job
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: oracle-free-${{ matrix.versions }}${{ steps.env_vars.outputs.IMAGE_FLAVOR }}-faststart-${{ steps.env_vars.outputs.IMAGE_ARCH }}
          path: oracle-free-${{ matrix.versions }}${{ steps.env_vars.outputs.IMAGE_FLAVOR }}-faststart-${{ steps.env_vars.outputs.IMAGE_ARCH }}.tar.gz

  upload-platform-images:
    name: ⬆️ 📋 Upload platform images to registries
    environment: upload
    runs-on: ubuntu-24.04
    needs: [ set-constants, build-and-test-images ]

    permissions:
      packages: write

    strategy:
      matrix:
        repository: [ "ghcr.io", "docker.io" ]
        versions: ${{ fromJSON(inputs.versions) }}
        arch: ${{ fromJSON(needs.set-constants.outputs.IMAGE_ARCH) }}
        flavor: [ "-full", "", "-slim" ] # "" is the "regular" image

    steps:
      - name: 🧹 Cleanup runner
        run: |
          # Remove Java (JDKs)
          sudo rm -rf /usr/lib/jvm

          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet

          # Remove Swift toolchain
          sudo rm -rf /usr/share/swift

          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup

          # Remove Julia
          sudo rm -rf /usr/local/julia*

          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium

          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google

          # Remove Azure CLI
          sudo rm -rf /opt/az

      - name: ⬇️ Download non-faststart image
        uses: actions/download-artifact@v8
        with:
          name: oracle-free-${{ matrix.versions }}${{ matrix.flavor }}-${{ matrix.arch }}

      - name: ⬇️ Download faststart image
        uses: actions/download-artifact@v8
        with:
          name: oracle-free-${{ matrix.versions }}${{ matrix.flavor }}-faststart-${{ matrix.arch }}

      - name: 📥 Import images
        run: |
          zcat oracle-free-${{ matrix.versions }}${{ matrix.flavor }}-${{ matrix.arch }}.tar.gz           | podman load
          rm oracle-free-${{ matrix.versions }}${{ matrix.flavor }}-${{ matrix.arch }}.tar.gz
          zcat oracle-free-${{ matrix.versions }}${{ matrix.flavor }}-faststart-${{ matrix.arch }}.tar.gz | podman load
          rm oracle-free-${{ matrix.versions }}${{ matrix.flavor }}-faststart-${{ matrix.arch }}.tar.gz

      - name: 🔓 Login to GHCR registry
        uses: redhat-actions/podman-login@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: 🔓 Login to Docker.io registry
        uses: redhat-actions/podman-login@v2
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_PWD }}
          registry: docker.io

      - name: 🫸 Push non-faststart image to Container Registry
        uses: redhat-actions/push-to-registry@v3
        with:
          registry: ${{ matrix.repository }}
          image: gvenzl/oracle-free
          tags: ${{ matrix.versions }}${{ matrix.flavor }}-${{ matrix.arch }}

      - name: 🫸 Push faststart image to  Container Registry
        uses: redhat-actions/push-to-registry@v3
        with:
          registry: ${{ matrix.repository }}
          image: gvenzl/oracle-free
          tags: ${{ matrix.versions }}${{ matrix.flavor }}-faststart-${{ matrix.arch }}

  create-versioned-manifests-tags:
    name: 📋 Create versioned manifests to registries
    environment: tag
    runs-on: ubuntu-24.04
    needs: [ set-constants, upload-platform-images ]
    strategy:
      matrix:
        repository: [ "ghcr.io", "docker.io" ]
        version: ${{ fromJSON(inputs.versions) }}
        image_flavor: [ "-full", "", "-slim" ]
        image_faststart: [ "-faststart", "" ]

    permissions:
      packages: write

    steps:

      - name: 🔓 Login to GHCR registry
        uses: redhat-actions/podman-login@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: 🔓 Login to Docker.io registry
        uses: redhat-actions/podman-login@v2
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_PWD }}
          registry: docker.io

      - name: 🫸 Push multi-arch manifest
        run: |
          podman manifest create ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.version }}${{ matrix.image_flavor }}${{ matrix.image_faststart }}
          podman manifest add ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.version }}${{ matrix.image_flavor }}${{ matrix.image_faststart }} \
                              ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.version }}${{ matrix.image_flavor }}${{ matrix.image_faststart }}-amd64
          podman manifest add ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.version }}${{ matrix.image_flavor }}${{ matrix.image_faststart }} \
                              ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.version }}${{ matrix.image_flavor }}${{ matrix.image_faststart }}-arm64
          podman push ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.version }}${{ matrix.image_flavor }}${{ matrix.image_faststart }}
          podman manifest rm ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.version }}${{ matrix.image_flavor }}${{ matrix.image_faststart }}


  create-latest-version-tags:
    if: ${{ inputs.latest_version != '' }}
    name: ⬆️ 📋 Upload latest images to registries
    environment: tag
    runs-on: ubuntu-24.04
    needs: [ set-constants, upload-platform-images ]

    permissions:
      packages: write

    strategy:
      matrix:
        repository: [ "ghcr.io", "docker.io" ]
        arch: ${{ fromJSON(needs.set-constants.outputs.IMAGE_ARCH) }}
        flavor: [ "-full", "", "-slim" ] # "" is the "regular" image

    steps:
      - name: 🧹 Cleanup runner
        run: |
          # Remove Java (JDKs)
          sudo rm -rf /usr/lib/jvm

          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet

          # Remove Swift toolchain
          sudo rm -rf /usr/share/swift

          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup

          # Remove Julia
          sudo rm -rf /usr/local/julia*

          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium

          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google

          # Remove Azure CLI
          sudo rm -rf /opt/az

      - name: ⬇️ Download non-faststart image
        uses: actions/download-artifact@v8
        with:
          name: oracle-free-${{ inputs.latest_version }}${{ matrix.flavor }}-${{ matrix.arch }}

      - name: ⬇️ Download faststart image
        uses: actions/download-artifact@v8
        with:
          name: oracle-free-${{ inputs.latest_version }}${{ matrix.flavor }}-faststart-${{ matrix.arch }}

      - name: 📥 Import images
        run: |
          zcat oracle-free-${{ inputs.latest_version }}${{ matrix.flavor }}-${{ matrix.arch }}.tar.gz           | podman load
          rm oracle-free-${{ inputs.latest_version }}${{ matrix.flavor }}-${{ matrix.arch }}.tar.gz
          zcat oracle-free-${{ inputs.latest_version }}${{ matrix.flavor }}-faststart-${{ matrix.arch }}.tar.gz | podman load
          rm oracle-free-${{ inputs.latest_version }}${{ matrix.flavor }}-faststart-${{ matrix.arch }}.tar.gz

      - name: 🏷️ Tag images
        id: tag-images
        env:
          FLAVOR: ${{ matrix.flavor }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Tag 23[-full | -slim][-faststart]
          podman tag gvenzl/oracle-free:${{ inputs.latest_version }}${FLAVOR}-${ARCH} oracle-free:23${FLAVOR}-${ARCH}
          podman tag gvenzl/oracle-free:${{ inputs.latest_version }}${FLAVOR}-faststart-${ARCH} oracle-free:23${FLAVOR}-faststart-${ARCH}

          # Tag [-latest] or [-slim | -full]
          if [[ "${FLAVOR}" == "" ]]; then # regular image
            FLAVOR_NO_DASH="latest"
            podman tag gvenzl/oracle-free:${{ inputs.latest_version }}-${ARCH} oracle-free:${FLAVOR_NO_DASH}-${ARCH}
            podman tag gvenzl/oracle-free:${{ inputs.latest_version }}-faststart-${ARCH} oracle-free:${FLAVOR_NO_DASH}-faststart-${ARCH}
          else
            FLAVOR_NO_DASH=${FLAVOR:1}
            podman tag gvenzl/oracle-free:${{ inputs.latest_version }}${FLAVOR}-${ARCH} oracle-free:${FLAVOR_NO_DASH}-${ARCH}
            podman tag gvenzl/oracle-free:${{ inputs.latest_version }}${FLAVOR}-faststart-${ARCH} oracle-free:${FLAVOR_NO_DASH}-faststart-${ARCH}
          fi;
          # Store value for push
          echo "FLAVOR_NO_DASH=${FLAVOR_NO_DASH}" >> $GITHUB_OUTPUT

      - name: 🔓 Login to GHCR registry
        uses: redhat-actions/podman-login@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: 🔓 Login to Docker.io registry
        uses: redhat-actions/podman-login@v2
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_PWD }}
          registry: docker.io

      - name: 🫸 Push 23 non-faststart image to Container Registry
        uses: redhat-actions/push-to-registry@v3
        with:
          registry: ${{ matrix.repository }}
          image: gvenzl/oracle-free
          tags: 23${{ matrix.flavor }}-${{ matrix.arch }}

      - name: 🫸 Push 23 faststart image to Container Registry
        uses: redhat-actions/push-to-registry@v3
        with:
          registry: ${{ matrix.repository }}
          image: gvenzl/oracle-free
          tags: 23${{ matrix.flavor }}-faststart-${{ matrix.arch }}

      - name: 🫸 Push versionless image to GitHub Container Registry
        uses: redhat-actions/push-to-registry@v3
        with:
          registry: ${{ matrix.repository }}
          image: gvenzl/oracle-free
          tags: ${{ steps.tag-images.outputs.FLAVOR_NO_DASH }}-${{ matrix.arch }}

      - name: 🫸 Push versionless faststart image to GitHub Container Registry
        uses: redhat-actions/push-to-registry@v3
        with:
          registry: ${{ matrix.repository }}
          image: gvenzl/oracle-free
          tags: ${{ steps.tag-images.outputs.FLAVOR_NO_DASH }}-faststart-${{ matrix.arch }}

  create-23-manifests-tags:
    if: ${{ inputs.latest_version != '' }}
    name: 📋 Create 23 manifests to registries
    environment: tag
    runs-on: ubuntu-24.04
    needs: [ set-constants, create-latest-version-tags ]
    strategy:
      matrix:
        repository: [ "ghcr.io", "docker.io" ]
        image_flavor: [ "-full", "", "-slim" ]
        image_faststart: [ "-faststart", "" ]

    permissions:
      packages: write

    steps:

      - name: 🔓 Login to GHCR registry
        uses: redhat-actions/podman-login@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: 🔓 Login to Docker.io registry
        uses: redhat-actions/podman-login@v2
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_PWD }}
          registry: docker.io

      - name: 🫸 Push multi-arch manifest
        run: |
          podman manifest create ${{ matrix.repository }}/gvenzl/oracle-free:23${{ matrix.image_flavor }}${{ matrix.image_faststart }}
          podman manifest add ${{ matrix.repository }}/gvenzl/oracle-free:23${{ matrix.image_flavor }}${{ matrix.image_faststart }} \
                              ${{ matrix.repository }}/gvenzl/oracle-free:23${{ matrix.image_flavor }}${{ matrix.image_faststart }}-amd64
          podman manifest add ${{ matrix.repository }}/gvenzl/oracle-free:23${{ matrix.image_flavor }}${{ matrix.image_faststart }} \
                              ${{ matrix.repository }}/gvenzl/oracle-free:23${{ matrix.image_flavor }}${{ matrix.image_faststart }}-arm64
          podman push ${{ matrix.repository }}/gvenzl/oracle-free:23${{ matrix.image_flavor }}${{ matrix.image_faststart }}
          podman manifest rm ${{ matrix.repository }}/gvenzl/oracle-free:23${{ matrix.image_flavor }}${{ matrix.image_faststart }}

  create-latest-manifests-tags:
    if: ${{ inputs.latest_version != '' }}
    name: 📋 Create latest manifests to registries
    environment: tag
    runs-on: ubuntu-24.04
    needs: [ set-constants, create-versioned-manifests-tags, create-latest-version-tags ]
    strategy:
      matrix:
        repository: [ "ghcr.io", "docker.io" ]
        image_flavor: [ "full", "latest", "slim" ]
        image_faststart: [ "-faststart", "" ]

    permissions:
      packages: write

    steps:

      - name: 🔓 Login to GHCR registry
        uses: redhat-actions/podman-login@v2
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: 🔓 Login to Docker.io registry
        uses: redhat-actions/podman-login@v2
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_PWD }}
          registry: docker.io

      - name: 🫸 Push multi-arch manifest
        run: |
          podman manifest create ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.image_flavor }}${{ matrix.image_faststart }}
          podman manifest add ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.image_flavor }}${{ matrix.image_faststart }} \
                              ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.image_flavor }}${{ matrix.image_faststart }}-amd64
          podman manifest add ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.image_flavor }}${{ matrix.image_faststart }} \
                              ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.image_flavor }}${{ matrix.image_faststart }}-arm64
          podman push ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.image_flavor }}${{ matrix.image_faststart }}
          podman manifest rm ${{ matrix.repository }}/gvenzl/oracle-free:${{ matrix.image_flavor }}${{ matrix.image_faststart }}

  cleanup:
    # Ignore result.skipped from optional jobs above but not failure or cancelled
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    name: 🧹 Cleanup build leftovers
    runs-on: ubuntu-24.04
    needs: [ create-versioned-manifests-tags, create-latest-manifests-tags, create-23-manifests-tags  ]
    permissions:
      deployments: write

    steps:
      - name: 🧹 Cleanup build deployments
        uses: strumwolf/delete-deployment-environment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: build
          onlyRemoveDeployments: true

      - name: 🧹 Cleanup upload deployments
        uses: strumwolf/delete-deployment-environment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: upload
          onlyRemoveDeployments: true

      - name: 🧹 Cleanup tag deployments
        uses: strumwolf/delete-deployment-environment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: tag
          onlyRemoveDeployments: true
